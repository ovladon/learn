name: One-time owner-only LEARN Chapter 05 materials import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ch05.yml']

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ovladon/learn' && github.actor == 'ovladon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack student-facing educational materials
        shell: bash
        run: |
          set -euo pipefail
          cat .release_ch05/part-*.bin > /tmp/ch05-assets.zip
          echo '992d8f6ef290b7f698a60d9fcfb7e735c1709ef4a55944e4ae1e2d7c81872e95  /tmp/ch05-assets.zip' | sha256sum -c -
          python3 - <<'PY'
          import pathlib,zipfile,stat
          root=pathlib.Path('_incoming').resolve()
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile('/tmp/ch05-assets.zip') as a:
            members=a.infolist()
            assert len(members)==44 and sum(x.file_size for x in members)<30_000_000, 'Unexpected release size'
            for f in members:
              p=(root/f.filename).resolve()
              assert p.is_relative_to(root) and not stat.S_ISLNK(f.external_attr >> 16)
              assert p.suffix in ('.pdf','.webp')
              assert f.filename.startswith(('materials/invisible/','previews/invis-','previews/big-picture-','collections/invisible-','collections/big-picture-'))
            a.extractall(root)
          assert len(list((root/'materials/invisible').glob('invis-*.pdf')))==24
          assert len(list((root/'previews').glob('invis-*.webp')))==12
          assert len(list((root/'previews').glob('big-picture-*.webp')))==2
          assert len(list((root/'collections').glob('invisible-*.pdf')))==2
          assert len(list((root/'collections').glob('big-picture-*.pdf')))==4
          print('PASS: 44 checked files')
          PY
          cp -a _incoming/. .
          rm -rf _incoming
      - name: Commit only the new public materials
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- materials/invisible/ previews/invis-*.webp previews/big-picture-*.webp collections/invisible-*.pdf collections/big-picture-*.pdf
          if git diff --cached --quiet; then
            echo 'Already in sync'
            exit 0
          fi
          git commit -m 'Add LEARN Chapter 05 bilingual printable lessons and system map posters'
          git push origin HEAD:main
