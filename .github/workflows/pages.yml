name: Deploy LEARN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learn-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only repository owner-initiated publishing is permitted.
    if: github.repository == 'ovladon/learn' && github.actor == 'ovladon'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site from directly accessible files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for f in BEGINNER_STANDARD.md lesson.html lesson.css lesson.js learner-notes.js quest.html quest.css quest.js quest-bank.js quest-config.js portfolio-qr.html portfolio-qr.js PEDAGOGICAL_AUDIT.md index.html system-map.html interactive-lab.html interactive-lab.css interactive-lab.js app.js catalog.js style.css favicon.svg robots.txt .nojekyll SECURITY.md SITE_MANIFEST.json RELEASE_INFO.json; do
            test -f "$f"
            cp "$f" _site/
          done
          for d in assets previews materials collections career; do
            test -d "$d"
            cp -a "$d" _site/
          done
          python3 - <<'PYVALIDATE'
          import pathlib,re
          root=pathlib.Path('_site')
          files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert len(list((root/'materials').rglob('*.pdf')))==156
          assert len(list((root/'collections').glob('big-o-*.pdf')))==4
          assert len(list((root/'materials/datacenters').glob('dc-*.pdf')))==26
          assert len(list((root/'materials/frontier').glob('front-*.pdf')))==24,'Expected 24 Frontier PDFs'
          assert len(list((root/'materials/invisible').glob('invis-*.pdf')))==24,'Expected 24 Invisible Systems PDFs'
          assert len(list((root/'previews').glob('invis-*.webp')))==12,'Expected 12 new previews'
          assert len(list((root/'materials/languages').glob('lang-*.pdf')))==30,'Expected 30 language PDFs'
          assert len(list((root/'previews').glob('lang-*.webp')))==15,'Expected 15 language previews'
          assert all((root/'collections'/f'languages-{l}.pdf').is_file() for l in ('en','ro'))
          assert all((root/'collections'/f'language-map-a3-{l}.pdf').is_file() for l in ('en','ro'))
          assert (root/'lesson.html').is_file() and (root/'learner-notes.js').is_file()
          assert (root/'system-map.html').is_file()
          for f in ('interactive-lab.html','interactive-lab.css','interactive-lab.js'):
              assert (root/f).is_file()
          interactive=(root/'interactive-lab.html').read_text(encoding='utf-8')
          assert all(x in interactive for x in ('panel-queue','panel-race','panel-cache','panel-resources'))
          assert all((root/'collections'/f'big-picture-a3-{l}.pdf').is_file() for l in ('en','ro'))
          assert all((root/'collections'/f'invisible-{l}.pdf').is_file() for l in ('en','ro'))
          assert (root/'collections/frontier-en.pdf').exists() and (root/'collections/frontier-ro.pdf').exists()
          catalog=(root/'catalog.js').read_text(encoding='utf-8')
          refs=re.findall(r"""['"]((?:materials|collections|previews|assets)/[^'"]+)['"]""",catalog)
          assert not [r for r in refs if r not in files]
          PYVALIDATE
      - name: Build Fast Start lessons and explained PDF editions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/learn-faststart-env
          /tmp/learn-faststart-env/bin/pip install --disable-pip-version-check 'reportlab==4.4.9' 'pypdf==5.9.0' 'markdown==3.9'
          /tmp/learn-faststart-env/bin/python tools/build_data_chapter.py --site _site
          /tmp/learn-faststart-env/bin/python tools/build_faststart.py --site _site
          /tmp/learn-faststart-env/bin/python tools/build_portfolio.py --site _site
          test "$(find _site/topics -maxdepth 1 -name '*.html' | wc -l)" -eq 185
          test "$(find _site/beginner -maxdepth 1 -name '*.pdf' | wc -l)" -eq 184
          test -s _site/sitemap.xml
          test -s _site/BEGINNER_AUDIT.json
          test "$(find _site/materials/data -name 'data-*.pdf' | wc -l)" -eq 28
          test -s _site/collections/data-en.pdf
          test -s _site/collections/data-ro.pdf
          test -s _site/portfolio-guide-ro.html
          test -s _site/portfolio-guide-en.html
          test -s _site/downloads/student-portfolio-starter.zip
          test -s _site/career/vendor/qrcode.js
          node --check _site/portfolio-qr.js
          node --check _site/career/vendor/qrcode.js
      - name: Verify topic-specific LEARN Quest bank
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/quest.js
          node --check _site/quest-bank.js
          python3 - <<'PYGAME'
          import json,re,pathlib
          root=pathlib.Path('_site')
          bank=(root/'quest-bank.js').read_text(encoding='utf8')
          bank=json.loads(bank.split('window.LEARN_QUEST_BANK =',1)[1].strip().rstrip(';'))
          catalog=(root/'catalog.js').read_text(encoding='utf8')
          cats=json.loads(catalog.split('window.LEARN_CATALOG =',1)[1].strip().rstrip(';'))
          assert len(bank)==len(cats)==92
          assert set(bank)=={x['id'] for x in cats}
          for id,q in bank.items():
            for lang in ('en','ro'):
              rounds=q[lang]['stages']
              assert len(rounds)==3
              for round in rounds:
                assert 0<=round['correct']<len(round['answers'])
                assert len(set(round['answers']))==len(round['answers'])
          print('184 bilingual topic games validated')
          PYGAME
          test -s _site/quest.html
      - name: Verify full beginner portfolio delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHECK'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          site=Path('_site')
          for lang in ('ro','en'):
              s=(site/f'portfolio-guide-{lang}.html').read_text(encoding='utf8')
              assert all(f'data-step="{n:02d}"' in s for n in range(23)), ('missing checkpoint',lang)
              assert all(x in s for x in ('github.io','portfolio-qr.html','downloads/student-portfolio-starter.zip')),lang
              assert len(s)>28000,(lang,len(s))
          landing=(site/'index.html').read_text(encoding='utf8')
          assert 'id="career"' in landing and 'portfolio-guide-ro.html' in landing
          assert 'portfolio-guide-en.html' in landing
          qr=(site/'portfolio-qr.html').read_text(encoding='utf8')
          assert 'career/vendor/qrcode.js' in qr and 'portfolio-qr.js' in qr
          with ZipFile(site/'downloads/student-portfolio-starter.zip') as z:
              assert set(z.namelist())=={'index.html','READ_ME_FIRST.txt'}
              inner=z.read('index.html')
              assert b'<!doctype html>' in inner and b'EXAMPLE' in inner
          print('Portfolio tutorial: 23 interactive checkpoints × 2 languages, links, starter ZIP: PASS')
          PYCHECK
          node - <<'NODECHECK'
          const assert=require('node:assert/strict');
          const qr=require('./_site/career/vendor/qrcode.js');
          const code=qr(0,'M');code.addData('https://student123.github.io/','Byte');code.make();
          assert(code.getModuleCount()>=21);assert(typeof code.isDark(0,0)==='boolean');
          console.log('Offline QR algorithm: PASS');
          NODECHECK
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
