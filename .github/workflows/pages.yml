name: Deploy LEARN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learn-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only repository owner-initiated publishing is permitted.
    if: github.repository == 'ovladon/learn' && github.actor == 'ovladon'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site from directly accessible files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for f in index.html app.js catalog.js style.css favicon.svg robots.txt .nojekyll SECURITY.md SITE_MANIFEST.json RELEASE_INFO.json; do
            test -f "$f"
            cp "$f" _site/
          done
          for d in assets previews materials collections; do
            test -d "$d"
            cp -a "$d" _site/
          done
          python3 - <<'PYVALIDATE'
          import pathlib,re
          root=pathlib.Path('_site')
          files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert len(list((root/'materials').rglob('*.pdf')))==102
          assert len(list((root/'collections').glob('big-o-*.pdf')))==4
          assert len(list((root/'materials/datacenters').glob('dc-*.pdf')))==26
          assert len(list((root/'materials/frontier').glob('front-*.pdf')))==24,'Expected 24 Frontier PDFs'
          assert (root/'collections/frontier-en.pdf').exists() and (root/'collections/frontier-ro.pdf').exists()
          catalog=(root/'catalog.js').read_text(encoding='utf-8')
          refs=re.findall(r"""['"]((?:materials|collections|previews|assets)/[^'"]+)['"]""",catalog)
          assert not [r for r in refs if r not in files]
          PYVALIDATE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
